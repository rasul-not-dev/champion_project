<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чемпион - 500</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #fff400;
            --secondary: rgb(38, 38, 38);
            --shadowbox: 0 0px 12px 8px rgba(255, 244, 0, 0.08);
            --border: solid 1px var(--primary);
            --textshadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        body {
            background-color: var(--secondary);
            font-family: 'Inter', sans-serif;
            color: var(--primary);
        }

        .server-error {
            padding: 20px;
        }

        .server-error__title {
            text-shadow: var(--textshadow);
            text-align: center;
            font-size: 29px;
            margin-bottom: 20px;
        }

        .server-error__image {
            display: block;
            max-width: 100%;
            border-radius: 20px;
            margin-bottom: 20px;
            margin-inline: auto;
        }

        .server-error__text {
            color: var(--primary);
            max-width: 565px;
            margin-bottom: 20px;
            margin-inline: auto;
            text-align: center;
            text-shadow: var(--textshadow);
            /* 16 --- 22 */
            font-size: clamp(1rem, 0.3414634146341464rem + 2.926829268292683vw, 1.375rem);
        }

        .server-error__button {
            padding: 10px 20px;
            border: var(--border);
            box-shadow: var(--shadowbox);
            text-shadow: var(--textshadow);
            display: block;
            width: fit-content;
            margin-inline: auto;
            border-radius: 10px;
            transition: .2s;
            background-color: var(--secondary);
            color: var(--primary);
            font-size: 16px;
        }

        .server-error__button:hover {
            transform: translateY(-2px);
        }
            

    </style>
</head>
